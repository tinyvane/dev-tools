[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portablecodex"
version = "0.1.0"
description = "Guided, fail-closed Codex portable workspace manager for Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tinyvane" }]
keywords = ["codex", "portable", "sessions", "memory", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.15.18"]

[project.scripts]
portablecodex = "portablecodex.cli:main"

[project.urls]
Homepage = "https://github.com/tinyvane/dev-tools"
Issues = "https://github.com/tinyvane/dev-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
